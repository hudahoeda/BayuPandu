<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:240px; height:320px; overflow:hidden; background:#FFFFFF; color:#000; font-family:'Roboto Condensed',sans-serif; display:flex; }
  .bar { width:22px; border-right:2px solid #000; position:relative; }
  .bar .z { position:absolute; left:0; right:0; top:50%; border-top:2px solid #000; }
  .bar .f { position:absolute; left:3px; right:3px; bottom:50%; height:36%; background:#1E9E3A; }
  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); }
  .b { border-right:1px solid #000; border-bottom:1px solid #000; padding:3px 5px; display:flex; flex-direction:column; justify-content:space-between; }
  .b:nth-child(2n) { border-right:0; }
  .b .k { font-size:11px; font-weight:700; }
  .b .v { font-size:38px; font-weight:700; text-align:right; line-height:1; }
  .b .v small { font-size:12px; }
</style></head>
<body>
  <div class="bar"><div class="z"></div><div class="f"></div></div>
  <div class="grid">
    <div class="b"><span class="k">Vario</span><span class="v">2.4<small>m/s</small></span></div>
    <div class="b"><span class="k">Alt</span><span class="v">1842<small>m</small></span></div>
    <div class="b"><span class="k">GS</span><span class="v">38<small>km/h</small></span></div>
    <div class="b"><span class="k">L/D</span><span class="v">9.5</span></div>
    <div class="b"><span class="k">Avg</span><span class="v">1.8<small>m/s</small></span></div>
    <div class="b"><span class="k">Time</span><span class="v">1:42</span></div>
  </div>
</body></html>
