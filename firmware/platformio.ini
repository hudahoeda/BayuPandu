; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

; ESP32-S3, any board: the pin map in src/config.h avoids the pins that boot
; straps, flash, PSRAM and USB take on every S3 module. The DevKitC-1 definition
; is the generic S3 one (8 MB flash, no PSRAM assumed).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Serial goes to the chip's own USB port, which every S3 board has.
build_flags = -I src -I firmware/src -DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h" -std=c++17 -D LV_LVGL_H_INCLUDE_SIMPLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.19.4
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit ILI9341@^1.6.1
    mikalhart/TinyGPSPlus@^1.0.3
test_ignore = test/*

; Host unit tests: `pio test -e native`. Only hardware-free sources are built;
; add a file to build_src_filter when a test needs it.
[env:native]
platform = native
framework =
test_framework = googletest
build_flags = -std=c++17 -Wall -Wextra -g -I src -I test
lib_deps =
    google/googletest@^1.15.2
    fabiobatsilva/ArduinoFake
lib_archive = no
test_build_src = true
build_src_filter =
    -<*>
    +<Services/VarioFilter.cpp>
    +<Services/VariometerService.cpp>
    +<Services/MelodyPlayer.cpp>
    +<UI/BootChime.cpp>
    +<Services/IGCParser.cpp>
    +<Services/SimulationService.cpp>
